<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Fotitos - Página Principal</title>
</head>
<body style="margin: 0; font-family: Arial, sans-serif;">

    <!-- ESQUINA SUPERIOR: Perfil y Cerrar/Iniciar sesión -->
    <div style="position: absolute; top: 15px; right: 20px; background: rgba(255, 255, 255, 0.9); padding: 8px 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 1000;">
        {% if user.is_authenticated %}
            <!-- Si ya inició sesión, muestra su nombre y el botón de salir -->
            <span style="margin-right: 10px;">👤 <strong>{{ user.username }}</strong></span>
            
            <form action="{% url 'logout' %}" method="post" style="display: inline;">
                {% csrf_token %}
                <button type="submit" style="background-color: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">
                    Cerrar sesión
                </button>
            </form>
        {% else %}
            <!-- Si no ha iniciado sesión, muestra el enlace para entrar -->
            <a href="{% url 'login' %}" style="text-decoration: none; color: #007bff; font-weight: bold;">Iniciar sesión</a>
        {% endif %}
    </div>

    <!-- EL RESTO DE TU PÁGINA PRINCIPAL (Tus publicaciones, fotos, etc.) -->
    <div style="padding: 40px;">
        <h1>¡Bienvenido a Fotitos! 📸</h1>
    
    </div>

</body>
</html>
