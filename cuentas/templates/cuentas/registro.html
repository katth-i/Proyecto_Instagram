<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Fotitos</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #fafafa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .main-container { width: 380px; }
        .card { background: white; border: 1px solid #dbdbdb; padding: 30px; text-align: center; border-radius: 4px; margin-bottom: 10px; }
        h1 { font-family: cursive; margin-bottom: 5px; font-size: 34px; color: #262626; }
        p.subtitle { color: #8e8e8e; font-size: 13px; font-weight: 600; margin-bottom: 20px; }
        form p { text-align: left; margin-bottom: 10px; font-size: 13px; color: #262626; }
        form label { display: block; margin-bottom: 2px; color: #8e8e8e; font-size: 11px; }
        form input { width: 100%; padding: 8px; border: 1px solid #dbdbdb; background: #fafafa; border-radius: 3px; box-sizing: border-box; font-size: 13px; }
        form ul.errorlist { color: #ed4956; font-size: 11px; list-style: none; padding: 0; margin: 2px 0; }
        button[type="submit"] { background: #0095f6; color: white; border: none; padding: 10px; width: 100%; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 15px; font-size: 14px; }
        button[type="submit"]:hover { background: #1877f2; }
        .footer-card { background: white; border: 1px solid #dbdbdb; padding: 15px; text-align: center; border-radius: 4px; font-size: 14px; }
        .footer-card a { color: #0095f6; text-decoration: none; font-weight: bold; }
    </style>
    
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        const fechaInput = document.querySelector('input[type="date"]');
        if (fechaInput) {
            const hoy = new Date();
            
            // Fecha máxima: Hoy (para que nadie elija fechas del futuro)
            fechaInput.max = hoy.toISOString().split("T")[0];

            // Fecha mínima: Hace 100 años (para evitar años absurdos como 1800)
            const minFecha = new Date(hoy.getFullYear() - 100, hoy.getMonth(), hoy.getDate());
            fechaInput.min = minFecha.toISOString().split("T")[0];
        }
    });
</script>

</head>

<body>
    <div class="main-container">
        <div class="card">
            <h1>Fotitos</h1>
            <p class="subtitle">Regístrate para ver fotos y momentos de tus amigos.</p>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Registrarse</button>
            </form>
        </div>

        <div class="footer-card">
            ¿Ya tienes una cuenta? <a href="{% url 'login' %}">Inicia sesión</a>
        </div>
    </div>
</body>
</html>
