<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Fotitos</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #fff7fa; color: #4a2b3a; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px 0; box-sizing: border-box; }
        .main-container { width: 380px; }
        .card { background: white; border: 1px solid #f6cfdd; padding: 30px; text-align: center; border-radius: 16px; margin-bottom: 10px; box-shadow: 0 4px 16px rgba(231, 84, 128, 0.08); }
        h1 { font-family: 'Pacifico', cursive; font-weight: normal; margin: 0 0 5px; font-size: 36px; color: #e75480; }
        p.subtitle { color: #a07a8b; font-size: 13px; font-weight: 600; margin-bottom: 20px; }
        form p { text-align: left; margin-bottom: 10px; font-size: 13px; color: #4a2b3a; }
        form label { display: block; margin-bottom: 2px; color: #a07a8b; font-size: 11px; }
        form input { width: 100%; padding: 8px; border: 1px solid #f6cfdd; background: #fff7fa; color: #4a2b3a; border-radius: 8px; box-sizing: border-box; font-size: 13px; }
        form input:focus { outline: none; border-color: #e75480; }
        /* Ajuste específico para que el checkbox no ocupe el 100% de ancho */
        form input[type="checkbox"] { width: auto; display: inline-block; margin-right: 5px; accent-color: #e75480; }
        form ul.errorlist { color: #e0455f; font-size: 11px; list-style: none; padding: 0; margin: 2px 0; }
        button[type="submit"] { background: #e75480; color: white; border: none; padding: 10px; width: 100%; font-family: inherit; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; font-size: 14px; }
        button[type="submit"]:hover { background: #c93d68; }
        .footer-card { background: white; border: 1px solid #f6cfdd; padding: 15px; text-align: center; border-radius: 16px; font-size: 14px; }
        .footer-card a { color: #e75480; text-decoration: none; font-weight: bold; }
    </style>
    
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        // 1. Restricción de fecha de nacimiento
        const fechaInput = document.querySelector('input[type="date"]');
        if (fechaInput) {
            const hoy = new Date();
            fechaInput.max = hoy.toISOString().split("T")[0];
            const minFecha = new Date(hoy.getFullYear() - 100, hoy.getMonth(), hoy.getDate());
            fechaInput.min = minFecha.toISOString().split("T")[0];
        }

        // 2. Funcionalidad de Mostrar/Ocultar Contraseña
        const passwordInputs = document.querySelectorAll("input[type='password']");
        if (passwordInputs.length > 0) {
            const container = document.createElement("div");
            container.style.marginTop = "10px";
            container.style.marginBottom = "10px";
            container.style.textAlign = "left";
            container.innerHTML = `
                <input type="checkbox" id="show-password" style="cursor: pointer;">
                <label for="show-password" style="font-size: 12px; color: #8e8e8e; cursor: pointer; display: inline;">Mostrar contraseña</label>
            `;
            
            const form = document.querySelector("form");
            const submitBtn = form ? form.querySelector("button[type='submit']") : null;
            
            if (form && submitBtn) {
                form.insertBefore(container, submitBtn);
            } else if (form) {
                form.appendChild(container);
            }

            const checkbox = document.getElementById("show-password");
            checkbox.addEventListener("change", function() {
                const tipo = checkbox.checked ? "text" : "password";
                passwordInputs.forEach(input => {
                    input.type = tipo;
                });
            });
        }
    });
    </script>
</head>

<body>
    <div class="main-container">
        <div class="card">
            <h1>Fotitos</h1>
            <p class="subtitle">Regístrate para ver fotos y momentos de tus amigos.</p>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Registrarse</button>
            </form>
        </div>

        <div class="footer-card">
            ¿Ya tienes una cuenta? <a href="{% url 'login' %}">Inicia sesión</a>
        </div>
    </div>
</body>
</html>
