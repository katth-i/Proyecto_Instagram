<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Fotitos</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #fff7fa; color: #4a2b3a; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .main-container { width: 350px; }
        .card { background: white; border: 1px solid #f6cfdd; padding: 40px; text-align: center; border-radius: 16px; margin-bottom: 10px; box-shadow: 0 4px 16px rgba(231, 84, 128, 0.08); }
        h1 { font-family: 'Pacifico', cursive; font-weight: normal; margin-bottom: 30px; font-size: 38px; color: #e75480; }
        .input-group { text-align: left; margin-bottom: 10px; }
        .input-group label { font-size: 12px; color: #a07a8b; display: block; margin-bottom: 3px; }
        input { width: 100%; padding: 10px; border: 1px solid #f6cfdd; background: #fff7fa; color: #4a2b3a; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        input:focus { outline: none; border-color: #e75480; }
        .password-container { position: relative; width: 100%; }
        .toggle-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #e75480; font-family: inherit; font-weight: bold; cursor: pointer; font-size: 12px; }
        button[type="submit"] { background: #e75480; color: white; border: none; padding: 10px; width: 100%; font-family: inherit; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; font-size: 14px; }
        button[type="submit"]:hover { background: #c93d68; }
        .footer-card { background: white; border: 1px solid #f6cfdd; padding: 20px; text-align: center; border-radius: 16px; font-size: 14px; }
        .footer-card a { color: #e75480; text-decoration: none; font-weight: bold; }
        .errorlist { color: #e0455f; font-size: 12px; list-style: none; padding: 0; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="card">
            <h1>Fotitos</h1>
            
            {% if messages %}
                <ul class="errorlist">
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="input-group">
                    <label>Usuario, Correo o Teléfono</label>
                    <input type="text" name="username" required>
                </div>
                
                <div class="input-group">
                    <label>Contraseña</label>
                    <div class="password-container">
                        <input type="password" name="password" id="id_password" required>
                        <button type="button" class="toggle-btn" id="togglePasswordBtn" onclick="togglePassword()">Mostrar</button>
                    </div>
                </div>

                <button type="submit">Iniciar Sesión</button>
            </form>
            
            <p style="margin-top: 15px; font-size: 12px;">
                <a href="{% url 'password_reset' %}" style="color: #c93d68; text-decoration: none;">¿Olvidaste tu contraseña?</a>
            </p>
        </div>

        <div class="footer-card">
            ¿No tienes una cuenta? <a href="{% url 'registro' %}">Regístrate</a>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('id_password');
            const btn = document.getElementById('togglePasswordBtn');
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                btn.textContent = "Ocultar";
            } else {
                passwordInput.type = "password";
                btn.textContent = "Mostrar";
            }
        }
    </script>
</body>
</html>
